<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabriel Tech | Cursos</title>

    <link rel="stylesheet" href="cursos.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background-glow"></div>
    <div class="scanlines"></div>

    <!-- PNGs DECORATIVOS -->

    <img src="img/gamer.png.png" class="decor gamer" alt="Gamer">

    <img src="img/cerebro.png.png" class="decor cerebro" alt="Cérebro">

    <img src="img/camera.png.png" class="decor camera" alt="Câmera">

    <img src="img/cafe.png.png" class="decor cafe" alt="Café">


    <!-- TÍTULO -->

    <header class="course-header">

        <span>GABRIEL TECH // COURSES</span>

        <h1>VIDEOAULAS</h1>

        <p>
            Conhecimento, prática e evolução.
        </p>

    </header>


    <!-- PLAYER -->

    <main class="course-content">

        <div class="video-frame">

            <video id="courseVideo" controls>

                <source src="videos/aula1.mp4" type="video/mp4">

                Seu navegador não suporta reprodução de vídeo.

            </video>

        </div>

        <div class="lesson-info">

            <span>AULA 01</span>

            <h2>INTRODUÇÃO</h2>

        </div>
        <button class="next-lesson" id="nextLesson">
    PRÓXIMA AULA →
</button>

    </main>


    <!-- CÓDIGO MOTIVACIONAL -->

    <div class="motivational-code">

        <div>
            <span class="purple">while</span>
            <span class="white">(</span>
            <span class="blue">studying</span>
            <span class="white">) {</span>
        </div>

        <div class="indent">
            <span class="green">learn</span><span class="white">();</span>
        </div>

        <div class="indent">
            <span class="green">practice</span><span class="white">();</span>
        </div>

        <div class="indent">
            <span class="green">evolve</span><span class="white">();</span>
        </div>

        <div>
            <span class="white">}</span>
        </div>

        <br>

        <div>
            <span class="blue">focus</span>
            <span class="white"> = </span>
            <span class="green">true</span><span class="white">;</span>
        </div>

        <div>
            <span class="blue">discipline</span>
            <span class="white"> = </span>
            <span class="green">true</span><span class="white">;</span>
        </div>

        <div>
            <span class="red">giveUp</span>
            <span class="white"> = </span>
            <span class="red">false</span><span class="white">;</span>
        </div>

        <br>

        <div class="comment">// Nunca desista.</div>
        <div class="comment">// Mantenha o foco.</div>
        <div class="comment">// Estude. Pratique. Evolua.</div>

    </div>
<script src="cursos.js"></script>
</body>

</html>
