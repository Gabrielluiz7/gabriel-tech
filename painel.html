<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabriel Tech | Curso</title>

    <link rel="stylesheet" href="painel.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- EFEITOS DE FUNDO -->

    <div class="scanlines"></div>

    <div class="background-glow"></div>


    <!-- =========================
         PNGs DECORATIVOS
    ========================== -->

    <img
        src="img/cursor.png.png"
        class="decor cursor"
        alt="Cursor neon"
    >

    <img
        src="img/wifi.png.png"
        class="decor wifi"
        alt="Wi-Fi"
    >

    <img
        src="img/computador.png.png"
        class="decor computador"
        alt="Computador"
    >

    <img
        src="img/meme.png.png"
        class="decor meme"
        alt="Imagem decorativa"
    >


    <!-- =========================
         CÓDIGO DECORATIVO
    ========================== -->

    <div class="code-decoration">

        <div class="code-line">

            <span class="red">if</span>

            <span class="blue">
                (Mood ==
            </span>

            <span class="green">
                Happy
            </span>

            <span class="blue">
                )
            </span>

        </div>


        <div class="code-line">

            <span class="white">
                {
            </span>

        </div>


        <div class="code-line indent">

            <span class="red">
                Food
            </span>

            <span class="white">
                =
            </span>

            <span class="green">
                Pizza
            </span>

            <span class="white">
                ;
            </span>

        </div>


        <div class="code-line indent">

            <span class="red">
                Drink
            </span>

            <span class="white">
                =
            </span>

            <span class="green">
                Café
            </span>

            <span class="white">
                ;
            </span>

        </div>


        <div class="code-line indent">

            <span class="red">
                Music
            </span>

            <span class="white">
                =
            </span>

            <span class="green">
                Heavy Metal
            </span>

            <span class="white">
                ;
            </span>

        </div>


        <div class="code-line">

            <span class="white">
                }
            </span>

        </div>

    </div>


    <!-- =========================
         ÁREA DO VÍDEO
    ========================== -->

    <main class="video-area">

        <div class="video-frame">

            <video controls>

                <source
                    src="videos/aula1.mp4"
                    type="video/mp4"
                >

                Seu navegador não suporta reprodução de vídeo.

            </video>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
